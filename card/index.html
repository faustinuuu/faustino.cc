<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>Faustino</title>
</head>

<body>
  <div class="card-container">
    <div class="card nitro-card">
      <div class="card-header">
        <div style="background: url('assets/img//banner.png')" class="banner-img">
        </div>
      </div>
      <div class="card-body">
        <div class="profile-header">
          <div class="profil-logo">
            <img src="assets/img//logo.png" />
          </div>
          <div class="badges-container">
            <div class="badge-item">
              <img src="assets/img//badges/HypeSquad_Balance.svg" alt="" />
              <div class="tooltip tooltip-up">HybeSquad Balance</div>
            </div>
            <div class="badge-item">
              <img src="assets/img/badges/Active_Developer.svg" alt="" />
              <div class="tooltip tooltip-up">Active Developer</div>
            </div>
            <div class="badge-item">
              <img src="assets/img/badges/nitro.svg" alt="" />
              <div class="tooltip tooltip-up">Subscriber since Sep 9, 2022</div>
            </div>
            <div class="badge-item">
              <img src="assets/img/badges/boost24month.svg" alt="" />
              <div class="tooltip tooltip-up">Server boosting since Sep 15, 2022</div>
            </div>
            <div class="badge-item">
              <img src="assets/img/badges/user.svg" alt="" />
              <div class="tooltip tooltip-up">
                Originally known as faustino#0001
              </div>
            </div>
          </div>
        </div>
        <div class="profile-body">
          <div class="username">
            <a> Faustino </a>
          </div>
          <p style="color: white;">faustino</p>
          <hr />
          <a href="https://github.com/faustinuuu" target="_blank" class="btn">Github</a>
          <div class="basic-infos">
            <div class="category-title">About Me</div>
            <p>
              Amateur <b>front-end</b> developer...
            </p>
          </div>
          <div class="basic-infos">
            <div class="category-title">Member Since</div>
            <div style="display: flex; align-items: center;">
              <img src="https://i.ibb.co/HpbSK8B/icons8-discord-16.png" style="margin-right: 10px;">
              <p style="margin: 0;">Jan 11, 2019</p>
            </div>
          </div>
          <div class="roles">
            <div class="category-title">Roles</div>
            <div class="roles-list">
              <div class="role">
                <div class="role-color" style="background: lightyellow"></div>
                <p>JavaScript</p>
              </div>
              <div class="role">
                <div class="role-color" style="background: darkred"></div>
                <p>HTML</p>
              </div>
              <div class="role">
                <div class="role-color" style="background: darkgreen"></div>
                <p>CSS</p>
              </div>
              <div class="role">
                <div class="role-color" style="background: yellow"></div>
                <p>Python</p>
              </div>
              <div class="role role-add">
                <div class="role-add-text">+</div>
              </div>
            </div>
          </div>
          <div class="note">
            <div class="category-title">Note</div>
            <textarea placeholder="Click to add a note"></textarea>
          </div>
          <div class="message">
            <input id="content" type="text" placeholder="Message @faustino" />
          </div>
          <div id="message-status" style="display: none;"><b>Message Sent!</b></div>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="assets/js/javascript.js"></script>
</body>

</html>
